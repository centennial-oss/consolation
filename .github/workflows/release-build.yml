name: Release Build

on:
  workflow_call:
    inputs:
      marketing_version:
        required: true
        type: string
      build_number:
        required: true
        type: string
      build_info_arch:
        required: true
        type: string
      app_store_export_destination:
        required: true
        type: string
      artifact_path_suffix:
        required: false
        type: string
        default: ''
      export_options_suffix:
        required: false
        type: string
        default: ''
      strip_version_v_prefix:
        required: false
        type: boolean
        default: false
      include_github_release:
        required: false
        type: boolean
        default: false
    outputs:
      marketing_version:
        description: Marketing version used for the build
        value: ${{ jobs.build.outputs.marketing_version }}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    outputs:
      marketing_version: ${{ steps.version.outputs.VERSION }}
    env:
      APP_NAME: Consolation
      SCHEME_NAME: Consolation
      PROJECT_PATH: Consolation.xcodeproj
      MAC_ARCHIVE_PATH: ${{ github.workspace }}/build/Consolation-macOS${{ inputs.artifact_path_suffix }}.xcarchive
      MAC_EXPORT_PATH: ${{ github.workspace }}/build/MacAppStoreExport${{ inputs.artifact_path_suffix }}
      IOS_ARCHIVE_PATH: ${{ github.workspace }}/build/Consolation-iOS${{ inputs.artifact_path_suffix }}.xcarchive
      IOS_EXPORT_PATH: ${{ github.workspace }}/build/iOSAppStoreExport${{ inputs.artifact_path_suffix }}
      EXPORT_OPTIONS_MAC_PLIST: /tmp/ExportOptions-Mac${{ inputs.export_options_suffix }}.plist
      EXPORT_OPTIONS_IOS_PLIST: /tmp/ExportOptions-iOS${{ inputs.export_options_suffix }}.plist
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Validate required secrets are present
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DEVID_CERT_BASE64: ${{ secrets.APPLE_DEVID_CERT_BASE64 }}
          APPLE_DIST_APP_CERT_BASE64: ${{ secrets.APPLE_DIST_APP_CERT_BASE64 }}
          APPLE_DIST_INSTALLER_CERT_BASE64: ${{ secrets.APPLE_DIST_INSTALLER_CERT_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          MAC_APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAC_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
          IOS_APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          REQUIRED_VARS=(
            APPLE_TEAM_ID
            APPLE_DEVID_CERT_BASE64
            APPLE_DIST_APP_CERT_BASE64
            APPLE_DIST_INSTALLER_CERT_BASE64
            APPLE_CERTIFICATE_PASSWORD
            KEYCHAIN_PASSWORD
            APPLE_SIGNING_IDENTITY
            APP_STORE_CONNECT_KEY_ID
            APP_STORE_CONNECT_ISSUER_ID
            APP_STORE_CONNECT_API_KEY
            MAC_APP_STORE_PROVISIONING_PROFILE_BASE64
            IOS_APP_STORE_PROVISIONING_PROFILE_BASE64
          )
          for var in "${REQUIRED_VARS[@]}"; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing required secret/value: $var"
              exit 1
            fi
          done

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run clean, test
        run: |
          make clean test

      - name: Import signing certificates
        env:
          APPLE_DEVID_CERT_BASE64: ${{ secrets.APPLE_DEVID_CERT_BASE64 }}
          APPLE_DIST_APP_CERT_BASE64: ${{ secrets.APPLE_DIST_APP_CERT_BASE64 }}
          APPLE_DIST_INSTALLER_CERT_BASE64: ${{ secrets.APPLE_DIST_INSTALLER_CERT_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security list-keychains -d user -s build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          echo "$APPLE_DEVID_CERT_BASE64" | base64 --decode > devid.p12
          echo "$APPLE_DIST_APP_CERT_BASE64" | base64 --decode > dist_app.p12
          echo "$APPLE_DIST_INSTALLER_CERT_BASE64" | base64 --decode > dist_installer.p12
          for p12 in devid.p12 dist_app.p12 dist_installer.p12; do
            security import "$p12" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild -T /usr/bin/productsign -T /usr/bin/xcodebuild
          done
          rm devid.p12 dist_app.p12 dist_installer.p12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Validate signing identities in CI keychain
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          security find-identity -v -p codesigning build.keychain | tee codesign-identities.txt
          security find-identity -v build.keychain | tee all-identities.txt
          echo "--- codesigning identities ---"
          cat codesign-identities.txt
          echo "--- all identities ---"
          cat all-identities.txt

          if ! grep -F "$APPLE_SIGNING_IDENTITY" codesign-identities.txt > /dev/null; then
            echo "::error::APPLE_SIGNING_IDENTITY not found in build.keychain: $APPLE_SIGNING_IDENTITY"
            exit 1
          fi

          if ! grep -F "Developer ID Application" codesign-identities.txt > /dev/null; then
            echo "::error::No Developer ID Application identity found in imported certificates."
            exit 1
          fi

          if grep -F "Apple Distribution" codesign-identities.txt > /dev/null; then
            echo "MAC_APP_STORE_SIGNING_CERTIFICATE=Apple Distribution" >> "$GITHUB_ENV"
          elif grep -F "3rd Party Mac Developer Application" codesign-identities.txt > /dev/null; then
            echo "MAC_APP_STORE_SIGNING_CERTIFICATE=3rd Party Mac Developer Application" >> "$GITHUB_ENV"
          else
            echo "::error::No Apple Distribution or 3rd Party Mac Developer Application identity found in imported certificates."
            exit 1
          fi

          if ! grep -F "3rd Party Mac Developer Installer" all-identities.txt > /dev/null; then
            echo "::error::No 3rd Party Mac Developer Installer identity found in imported certificates."
            exit 1
          fi

          if grep -F "Apple Distribution" codesign-identities.txt > /dev/null; then
            echo "IOS_APP_STORE_SIGNING_CERTIFICATE=Apple Distribution" >> "$GITHUB_ENV"
          elif grep -F "iPhone Distribution" codesign-identities.txt > /dev/null; then
            echo "IOS_APP_STORE_SIGNING_CERTIFICATE=iPhone Distribution" >> "$GITHUB_ENV"
          else
            echo "::error::No Apple Distribution/iPhone Distribution identity found in imported certificates."
            exit 1
          fi

      - name: Install App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/private_keys
          printf '%s' "$APP_STORE_CONNECT_API_KEY" | base64 --decode \
            > ~/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

      - name: Validate App Store Connect API key file
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

          test -s "$KEY_PATH" || { echo "::error::Decoded API key file is empty."; exit 1; }

          python3 - <<'PY'
          from pathlib import Path
          import sys

          key_dir = Path.home() / "private_keys"
          files = list(key_dir.glob("AuthKey_*.p8"))
          if len(files) != 1:
              print("::error::Expected exactly one AuthKey_*.p8 file.")
              sys.exit(1)

          data = files[0].read_bytes()

          checks = [
              (data.startswith(b"-----BEGIN PRIVATE KEY-----\n") or data.startswith(b"-----BEGIN PRIVATE KEY-----\r\n"), "missing PEM header"),
              (data.rstrip().endswith(b"-----END PRIVATE KEY-----"), "missing PEM footer"),
              (b"\x00" not in data, "contains NUL byte(s)"),
              (len(data) > 100, "unexpectedly short PEM file"),
          ]
          for ok, msg in checks:
              if not ok:
                  print(f"::error::Decoded API key file invalid: {msg}")
                  sys.exit(1)

          print("API key file passed non-secret structural validation.")
          PY

      - name: Install Mac App Store provisioning profile
        env:
          MAC_APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAC_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$MAC_APP_STORE_PROVISIONING_PROFILE_BASE64" | base64 --decode > /tmp/profile.provisionprofile
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          UUID=$(security cms -D -i /tmp/profile.provisionprofile 2>/dev/null | plutil -extract UUID raw - 2>/dev/null || echo "mac-app-store")
          cp /tmp/profile.provisionprofile "$PROFILE_DIR/${UUID}.provisionprofile"
          echo "Installed provisioning profile: $UUID"
          echo "MAC_APP_STORE_PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Install iOS App Store provisioning profile
        env:
          IOS_APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$IOS_APP_STORE_PROVISIONING_PROFILE_BASE64" | base64 --decode > /tmp/ios-profile.mobileprovision
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          UUID=$(security cms -D -i /tmp/ios-profile.mobileprovision 2>/dev/null | plutil -extract UUID raw - 2>/dev/null || echo "ios-app-store")
          cp /tmp/ios-profile.mobileprovision "$PROFILE_DIR/${UUID}.mobileprovision"
          echo "Installed iOS provisioning profile: $UUID"
          echo "IOS_APP_STORE_PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Set marketing version and build number
        id: version
        run: |
          set -euo pipefail
          VERSION="${{ inputs.marketing_version }}"
          if [ "${{ inputs.strip_version_v_prefix }}" = "true" ]; then
            VERSION="${VERSION#v}"
          fi
          BUILD_NUMBER="${{ inputs.build_number }}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          {
            printf 'MARKETING_VERSION = %s\n' "$VERSION"
            printf 'CURRENT_PROJECT_VERSION = %s\n' "$BUILD_NUMBER"
            printf 'INFOPLIST_KEY_NSHumanReadableCopyright = Copyright © 2026 Centennial OSS\n'
          } > "${{ env.SCHEME_NAME }}/Version.xcconfig"

      - name: Sanitize project.pbxproj (remove version overrides)
        run: |
          sed -i '' -e '/MARKETING_VERSION/d' -e '/CURRENT_PROJECT_VERSION/d' "$PROJECT_PATH/project.pbxproj"

      - name: Generate build info
        run: |
          COMMIT="${{ github.sha }}" \
          DATE="$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")" \
          CONFIG="Release" \
          ARCH="${{ inputs.build_info_arch }}" \
          make generate-build-info

      - name: Build ${{ env.APP_NAME }} for direct distribution (GitHub release)
        if: inputs.include_github_release
        run: |
          xcodebuild -scheme ${{ env.SCHEME_NAME }} \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=macOS' \
            ARCHS="arm64 x86_64" \
            CODE_SIGN_IDENTITY="-" \
            clean build

      - name: Code sign app (Developer ID - for GitHub release)
        if: inputs.include_github_release
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          APP_PATH="build/Build/Products/Release/${{ env.APP_NAME }}.app"
          XCENT="build/Build/Intermediates.noindex/${{ env.SCHEME_NAME }}.build/Release/${{ env.SCHEME_NAME }}.build/${{ env.APP_NAME }}.app.xcent"
          ENTITLEMENTS="build/Release.entitlements"
          cp "$XCENT" "$ENTITLEMENTS"
          /usr/libexec/PlistBuddy -c "Set :com.apple.security.get-task-allow false" "$ENTITLEMENTS"
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" \
            --options runtime \
            --entitlements "$ENTITLEMENTS" \
            "$APP_PATH"
          codesign --verify --verbose "$APP_PATH"

      - name: Notarize app (GitHub release)
        if: inputs.include_github_release
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun notarytool store-credentials "notarytool-profile" \
            --key ~/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID"
          cd build/Build/Products/Release
          ditto -c -k --keepParent "${{ env.APP_NAME }}.app" notarization.zip
          SUBMIT_OUTPUT=$(xcrun notarytool submit notarization.zip --keychain-profile "notarytool-profile" --wait 2>&1)
          echo "$SUBMIT_OUTPUT"
          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
          if echo "$SUBMIT_OUTPUT" | grep -q "status: Invalid"; then
            echo "::error::Notarization was rejected (Invalid). Submission ID: $SUBMISSION_ID"
            echo "--- Notarization log ---"
            xcrun notarytool log "$SUBMISSION_ID" --keychain-profile "notarytool-profile" || true
            echo "--- End log ---"
            exit 1
          fi
          xcrun stapler staple "${{ env.APP_NAME }}.app"
          rm notarization.zip

      - name: Prepare release asset
        if: inputs.include_github_release
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          cd build/Build/Products/Release
          zip -r "${{ env.SCHEME_NAME }}-${VERSION}-macOS-universal.zip" "${{ env.APP_NAME }}.app"
          mv "${{ env.SCHEME_NAME }}-${VERSION}-macOS-universal.zip" "$GITHUB_WORKSPACE/"

      - name: Make DMG
        if: inputs.include_github_release
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          DMG_NAME="${{ env.APP_NAME }}"
          DMG_FILE="${{ env.SCHEME_NAME }}-${VERSION}-macOS-universal.dmg"
          mkdir -p dmg-contents
          cp -R "build/Build/Products/Release/${{ env.APP_NAME }}.app" dmg-contents/
          ln -s /Applications dmg-contents/Applications
          hdiutil create -volname "$DMG_NAME" -srcfolder dmg-contents -ov -format UDZO "$DMG_FILE"
          rm -rf dmg-contents

      - name: Archive for Mac App Store
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -scheme ${{ env.SCHEME_NAME }} \
            -configuration Release \
            -archivePath ${{ env.MAC_ARCHIVE_PATH }} \
            -destination 'generic/platform=macOS' \
            ARCHS="arm64 x86_64" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE="$MAC_APP_STORE_PROFILE_UUID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$MAC_APP_STORE_SIGNING_CERTIFICATE"

      - name: Export Mac App Store package
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy \
            -c "Add :method string app-store-connect" \
            -c "Add :destination string ${{ inputs.app_store_export_destination }}" \
            -c "Add :signingStyle string manual" \
            -c "Add :signingCertificate string $MAC_APP_STORE_SIGNING_CERTIFICATE" \
            -c "Add :installerSigningCertificate string 3rd Party Mac Developer Installer" \
            -c "Add :provisioningProfiles dict" \
            -c "Add :provisioningProfiles:org.centennialoss.consolation string $MAC_APP_STORE_PROFILE_UUID" \
            -c "Add :teamID string $APPLE_TEAM_ID" \
            "$EXPORT_OPTIONS_MAC_PLIST"
          UPLOAD_ARGS=()
          if [ "${{ inputs.app_store_export_destination }}" = "upload" ]; then
            UPLOAD_ARGS=(
              -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID"
              -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
              -authenticationKeyPath "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
            )
          fi
          xcodebuild -exportArchive \
            -archivePath "$MAC_ARCHIVE_PATH" \
            -exportPath "$MAC_EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS_MAC_PLIST" \
            "${UPLOAD_ARGS[@]}"

      - name: Verify exported Mac package exists and is signed
        if: inputs.app_store_export_destination == 'export'
        run: |
          set -euo pipefail
          shopt -s nullglob
          PKGS=("$MAC_EXPORT_PATH"/*.pkg)
          if [ ${#PKGS[@]} -eq 0 ]; then
            echo "::error::No .pkg found in $MAC_EXPORT_PATH after export step."
            ls -la "$MAC_EXPORT_PATH" || true
            exit 1
          fi
          PKG_PATH="${PKGS[0]}"
          echo "Exported package: $PKG_PATH"
          pkgutil --check-signature "$PKG_PATH"

      - name: Archive iPad app for App Store
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -scheme ${{ env.SCHEME_NAME }} \
            -configuration Release \
            -archivePath ${{ env.IOS_ARCHIVE_PATH }} \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE="$IOS_APP_STORE_PROFILE_UUID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$IOS_APP_STORE_SIGNING_CERTIFICATE"

      - name: Export iPad app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy \
            -c "Add :method string app-store-connect" \
            -c "Add :destination string ${{ inputs.app_store_export_destination }}" \
            -c "Add :signingStyle string manual" \
            -c "Add :signingCertificate string $IOS_APP_STORE_SIGNING_CERTIFICATE" \
            -c "Add :provisioningProfiles dict" \
            -c "Add :provisioningProfiles:org.centennialoss.consolation string $IOS_APP_STORE_PROFILE_UUID" \
            -c "Add :teamID string $APPLE_TEAM_ID" \
            "$EXPORT_OPTIONS_IOS_PLIST"
          UPLOAD_ARGS=()
          if [ "${{ inputs.app_store_export_destination }}" = "upload" ]; then
            UPLOAD_ARGS=(
              -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID"
              -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
              -authenticationKeyPath "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
            )
          fi
          xcodebuild -exportArchive \
            -archivePath "$IOS_ARCHIVE_PATH" \
            -exportPath "$IOS_EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS_IOS_PLIST" \
            "${UPLOAD_ARGS[@]}"

      - name: Verify exported iPad app exists
        if: inputs.app_store_export_destination == 'export'
        run: |
          set -euo pipefail
          shopt -s nullglob
          IPAS=("$IOS_EXPORT_PATH"/*.ipa)
          if [ ${#IPAS[@]} -eq 0 ]; then
            echo "::error::No .ipa found in $IOS_EXPORT_PATH after export step."
            ls -la "$IOS_EXPORT_PATH" || true
            exit 1
          fi
          echo "Exported IPA: ${IPAS[0]}"

      - name: Create Release
        if: inputs.include_github_release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.SCHEME_NAME }}-*-macOS-universal.zip
            ${{ env.SCHEME_NAME }}-*-macOS-universal.dmg
          generate_release_notes: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
