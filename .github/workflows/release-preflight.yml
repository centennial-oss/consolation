name: Release Preflight

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    if: github.repository_owner == 'centennial-oss' && github.ref_name == 'main'
    uses: ./.github/workflows/release-build.yml
    secrets: inherit
    with:
      marketing_version: 0.0.0-preflight
      build_number: ${{ github.run_number }}
      build_info_arch: arm64
      app_store_export_destination: export
      artifact_path_suffix: -preflight
      export_options_suffix: -preflight
      include_github_release: false
